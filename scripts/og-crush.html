<!doctype html><meta charset="utf-8">
<!-- 던전 크러시 공유 미리보기(OG 1200×630) 만들기 판. 레포 뿌리에서 띄워 /scripts/og-crush.html 로 열고 1200×630 으로 찍는다.
     11/22: 홈 「밝은 첫 화면」 과 같은 바탕 · 기울인 그림 카드로 다시 만듦. 예전 그래픽 이미지(가운데에서 뻗는 방사 줄무늬)는 쓰지 않는다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
 *{margin:0;box-sizing:border-box}
 body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:"Noto Sans KR",sans-serif;
   background:
     radial-gradient(52rem 26rem at 8% -10%,rgba(143,179,220,.55),transparent 70%),
     radial-gradient(38rem 24rem at 92% 18%,rgba(122,111,224,.22),transparent 72%),
     radial-gradient(30rem 18rem at 70% 105%,rgba(63,134,216,.18),transparent 70%),
     linear-gradient(180deg,#E2EAF4 0%,#F4F6F9 100%)}
 .txt{position:absolute;left:72px;top:150px;width:470px}
 .chip{display:inline-block;padding:6px 18px;border-radius:999px;background:rgba(255,255,255,.85);color:#21374E;
   font-weight:700;font-size:24px;box-shadow:0 0 0 1px rgba(229,231,235,.9),0 6px 18px rgba(30,35,41,.08)}
 h1{margin-top:22px;font-weight:900;font-size:84px;line-height:1.1;letter-spacing:-.035em;
   background:linear-gradient(100deg,#131A2B 0%,#21374E 40%,#3F86D8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
 p{margin-top:20px;font-weight:500;font-size:30px;color:#3C4453}
 .art{position:absolute;right:56px;top:118px;width:600px;aspect-ratio:16/9;object-fit:cover;border-radius:22px;border:6px solid #fff;
   transform:rotate(-3.5deg);box-shadow:0 36px 70px -20px rgba(33,55,78,.55),0 10px 22px rgba(33,55,78,.18)}
 #lg{position:absolute;left:72px;bottom:56px;width:92px}
 #lg img{width:100%;height:auto;display:block}
</style>
<div class="txt"><span class="chip">벌써아침</span><h1>던전 크러시</h1><p>매치3 퍼즐 · Android · iOS</p></div>
<img class="art" src="../assets/img/home/crush-cover.webp" alt="">
<div id="lg"><img src="../assets/img/logo.svg" alt=""></div>
